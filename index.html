<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="app-build" content="20261020-2">
<title>Pouring Report</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<style>
:root{--navy:#1F3864;--grey:#595959;--line:#BFBFBF;--tile:#F3F6FA;--green:#00863D;--red:#C00000;--amber:#C55A11;--bg:#EEF1F6}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#222;font-size:15px;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;font-weight:400;font-size:12px;opacity:.8}
#sync{font-size:12px;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.18);white-space:nowrap}
main{padding:12px 12px 84px;max-width:920px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 4px 9px;font:inherit;font-size:13px;color:var(--grey);border-top:3px solid transparent}
nav button.on{color:var(--navy);font-weight:700;border-top-color:var(--navy)}
nav b{display:block;font-size:19px;line-height:1.1}
.view{display:none}.view.on{display:block}
.card{background:#fff;border:1px solid #dfe3ea;border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--tile);border:1px solid #d5dbe6;border-radius:8px;padding:8px 6px;text-align:center}
.tile span{display:block;font-size:10.5px;font-weight:700;color:var(--grey);letter-spacing:.3px}
.tile b{display:block;font-size:19px;color:var(--navy);margin-top:2px}
.tile.wide{grid-column:1/3}
.bar{height:10px;background:#d9dfea;border-radius:5px;overflow:hidden;margin:6px 8px 2px}
.bar i{display:block;height:100%;background:var(--navy)}
.blocks{display:flex;gap:3px;margin:7px 8px 2px}.blocks i{flex:1;height:12px;border-radius:3px;background:#D9DFEA}.blocks i.on{background:var(--navy)}
.good{color:var(--green)!important}.bad{color:var(--red)!important}
button.big{width:100%;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:13px;margin-bottom:12px}
button.big.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btnrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .btnrow button.big{padding:13px 4px;font-size:15px;white-space:nowrap}
@media (max-width:420px){ .btnrow{grid-template-columns:repeat(2,1fr)} }
button.big.warn{background:#fff;color:var(--red);border:1.5px solid var(--red)}
button.sm{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font:inherit;font-size:13px}
#picwrap{overflow:auto;border:1px solid #dfe3ea;border-radius:8px;background:#fff}
#pic{display:block;width:100%;height:auto}
#picwrap.zoom #pic{width:880px}
label{display:block;font-size:12.5px;color:var(--grey);margin:8px 0 3px;font-weight:600}
input,textarea,select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#FFFDF3}
textarea{min-height:120px;resize:vertical;direction:ltr}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hour{border-top:1px solid #e6e9ef;padding:8px 0}
.hour:first-of-type{border-top:0}
.hour .h{display:flex;align-items:center;gap:8px;font-weight:700}
.hour .h span{flex:1}
.chip{display:inline-block;min-width:54px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700}
.chip.g{background:#C6EFCE;color:#006100}.chip.r{background:#FFC7CE;color:#9C0006}.chip.p{background:#EDEDED;color:var(--grey);font-style:italic}
.hour .e{display:grid;grid-template-columns:110px 1fr;gap:8px;margin-top:6px}
.hour .e input{padding:6px 8px;font-size:14px}
.msg{border-top:1px solid #e6e9ef;padding:7px 0;font-size:13.5px}
.msg .top{display:flex;gap:8px;align-items:center}
.msg .n{width:30px;color:var(--grey);font-size:12px}
.msg .t{width:44px;font-weight:700}.msg .p{width:30px}.msg .q{width:54px;text-align:right}
.msg .f{flex:1;text-align:right;font-size:12px}
.msg .raw{color:#777;font-size:12px;direction:ltr;word-break:break-word;margin-top:2px}
.msg.warn{background:#FFF7DB}.msg.rej .q{color:var(--red);text-decoration:line-through}
.msg .ed{display:none;margin-top:6px}.msg.open .ed{display:block}
.msg .ed .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.flag-w{color:#9a5b00;font-weight:700}.flag-i{color:#2E75B6}
.msg .qa{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.scheck{border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.scheck.ok{background:#E8F5EC;color:#00632B}.scheck.bad{background:#FFF7DB;color:#7a4a00}
.scheck .si{display:inline-flex;align-items:center;gap:6px;margin:6px 10px 0 0}.scheck .si button{padding:3px 8px;font-size:12px}
.msg.hl{outline:2px solid #C00000;outline-offset:-2px}
.pour{display:flex;align-items:center;gap:8px;border-top:1px solid #e6e9ef;padding:8px 0}
.pour div{flex:1}.pour small{color:var(--grey);display:block}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:18px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:.95}
.muted{color:var(--grey);font-size:12.5px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}.tile.wide{grid-column:span 2}}
</style>
</head>
<body>
<header><h1>Pouring Report<small id="hTitle"></small></h1><span id="sync">local</span></header>
<main>
  <section class="view on" id="v-report">
    <div class="card"><div class="tiles" id="tiles"></div></div>
    <div class="btnrow"><button class="big" id="bSavePic">💾 Save</button><button class="big" id="bCopyPic">📋 Copy</button><button class="big" id="bShare">📤 Share</button><button class="big" id="bOpenPic">🔍 Open</button></div>
    <div class="card"><h2>Picture preview <button class="sm" id="bZoom" style="float:right;margin-top:-4px">Zoom</button></h2>
      <div id="picwrap"><canvas id="pic"></canvas></div></div>
    <div class="card"><h2>Hours — rate change &amp; comments</h2><div id="hours"></div></div>
  </section>

  <section class="view" id="v-msgs">
    <div class="card"><h2>Paste messages from the group</h2>
      <textarea id="paste" placeholder="Copy the truck messages in WhatsApp and paste them here…"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="big" id="bAdd" style="margin:0">Add messages</button></div>
      <div class="muted" id="addInfo" style="margin-top:8px"></div></div>
    <div class="card"><h2 id="mHead">Messages</h2><div id="sCheck"></div><div id="msgs"></div></div>
  </section>

  <section class="view" id="v-setup">
    <div class="card"><h2>Pour setup</h2>
      <label>Title</label><input id="sTitle" data-k="title">
      <div class="row2"><div><label>Date</label><input id="sDate" type="date" data-k="date"></div>
        <div><label>Start time (optional)</label><input id="sStart" type="time" data-k="start"></div></div>
      <div class="row2"><div><label>Total quantity Q (m³)</label><input id="sQ" type="number" inputmode="decimal" data-k="q"></div>
        <div><label>Requested rate (m³/h)</label><input id="sReq" type="number" inputmode="decimal" data-k="req"></div></div>
      <label>Truck load in this pour (checked on every message)</label>
      <select id="sLoad" data-k="load"><option value="full">Full capacity — trucks 101–107 = 10 m³, others = 12 m³</option>
        <option value="1">1 m³ every truck</option><option value="2">2 m³ every truck</option><option value="3">3 m³ every truck</option><option value="4">4 m³ every truck</option>
        <option value="5">5 m³ every truck</option><option value="6">6 m³ every truck</option><option value="7">7 m³ every truck</option><option value="8">8 m³ every truck</option>
        <option value="9">9 m³ every truck</option><option value="10">10 m³ every truck</option><option value="11">11 m³ every truck</option><option value="12">12 m³ every truck</option></select>
      <label>Rejected m³ (manual, optional)</label><input id="sRej" type="number" inputmode="decimal" data-k="rejManual">
      <label>Plant names (#1 … #5)</label><div id="plants" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px"></div>
    </div>
    <button class="big" id="bFin" style="background:#00863D">Mark this pour as FINISHED</button>
    <button class="big alt" id="bXls">Download this pour as Excel</button>
    <button class="big alt" id="bNew">New pour</button>
    <div class="card"><h2>Saved pours</h2>
      <div class="filters">
        <input id="fName" type="search" placeholder="Search by name…" autocomplete="off">
        <div class="row2"><div><label>From date</label><input id="fFrom" type="date"></div><div><label>To date</label><input id="fTo" type="date"></div></div>
        <button class="sm" id="fClear" style="margin-top:8px">Clear filter</button>
      </div>
      <div class="muted" id="fCount" style="margin:8px 0 2px"></div>
      <div id="pours"></div></div>
    <div class="card"><h2>Sync between phone and laptop</h2>
      <div class="muted" id="syncInfo"></div>
      <label>Sync password</label><input id="sPwd" type="password" autocomplete="off" placeholder="Same password on every device">
      <div style="display:flex;gap:8px;margin-top:8px"><button class="sm" id="bPwd">Save password</button><button class="sm" id="bSync">Sync now</button><button class="sm" id="bOff">Turn sync off on this device</button></div>
    </div>
    <button class="big warn" id="bDel">Delete this pour</button>
    <div class="muted" style="text-align:center">build <span id="build"></span></div>
  </section>
</main>
<nav>
  <button data-v="report" class="on"><b>▤</b>Report</button>
  <button data-v="msgs"><b>✉</b>Messages</button>
  <button data-v="setup"><b>⚙</b>Setup</button>
</nav>
<div id="toast"></div>

<script>
'use strict';
/* ====== settings ====== */
const QS = new URLSearchParams(location.search);
const SYNC_URL = QS.get('sync') || 'https://script.google.com/macros/s/AKfycbwdc91ZDEERMKNh3uU2o8xb3kWil258-Oin4c-9OwEUutIPzdCryvbxSuucHLa8mVw7/exec';                       // Apps Script web app URL (set after deployment)
const LS = 'pouringreport:v1' + (QS.get('dev') ? ':' + QS.get('dev') : '');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ====== state ====== */
let S = load();
function load(){
  let s = null; try { s = JSON.parse(localStorage.getItem(LS)); } catch(e){}
  if (!s || !s.pours) s = {cur:null, pours:{}, key:null};
  if (!s.cur || !s.pours[s.cur] || s.pours[s.cur].deleted) { const p = newPour(); s.pours[p.id] = p; s.cur = p.id; }
  return s;
}
function newPour(){
  const d = new Date(), z = n => String(n).padStart(2,'0');
  return {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), title:'', date: d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()),
          q:'', req:'', start:'', rejManual:'', load:'full', serialOk:[], plants:['L1','L2','V3','V4','V5'], msgs:[], del:[], changes:{}, comments:{}, at:Date.now(), rev:0, dirty:true};
}
const cur = () => S.pours[S.cur];
function save(touch){
  if (touch !== false) { cur().at = Date.now(); cur().dirty = true; queueSync(); }
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){ toast('Storage is full on this device'); }
}

/* ====== message parsing (same rules as the Excel sheet) ====== */
const AR = '٠١٢٣٤٥٦٧٨٩';
function cleanLine(s){
  let t = String(s).replace(/[٠-٩]/g, d => AR.indexOf(d)).replace(/[‎‏‪-‮]/g,'').trim();
  if (t[0] === '[') { const i = t.indexOf(']'), j = t.indexOf(': ', i); if (i > 0 && j > 0) t = t.slice(j + 2).trim(); }
  return t;
}
function parseMsg(t){
  const o = {raw:null, plant:null, qty:null, serial:null};
  const tm = t.match(/(?:^|[^\d])(\d{1,2}):(\d{2})(?!\d)/);
  if (tm && +tm[1] < 24 && +tm[2] < 60) o.raw = +tm[1]*60 + +tm[2];
  const pm = t.match(/#\s*([1-5])/); if (pm) o.plant = +pm[1] - 1;
  const qm = t.match(/(\d+(?:\.\d+)?)\s*[mMم](?![A-Za-z])/); if (qm) o.qty = +qm[1];
  if (o.raw !== null || o.plant !== null) { const s = t.replace(/[*_]/g,'').trim(), sm = s.match(/^(\d{1,4})(?!\d)/); if (sm) o.serial = +sm[1];
    const tk = s.match(/^\d{1,4}[^\d:]+(\d{3})(?![\d:])/); if (tk) o.truck = +tk[1]; }   // "5.  102  11:54 …" → serial 5, truck 102
  return o;
}
// biggest load a truck can carry: 101–107 are 10 m³ trucks, all the others 12 m³
const truckMax = n => n >= 101 && n <= 107 ? 10 : 12;
function isNoise(t){ const p = parseMsg(t); return p.raw === null && p.plant === null && p.qty === null; }

/* ====== calculations ====== */
const fmt = n => { if (n === '' || n === null || isNaN(n)) return ''; const r = Math.round(n*10)/10; return Math.abs(r) >= 1000 ? Math.round(r).toLocaleString('en-US') : String(r); };
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
function compute(p){
  const rows = [], seen = new Set(), serials = [];
  let prevMax = 0, n = 0;
  p.msgs.forEach((m, idx) => {
    const t = cleanLine(m.t), r = Object.assign({idx, text:t, rej:m.r, flag:'', warn:false}, parseMsg(t));
    if (seen.has(t)) { r.dup = true; r.flag = 'Duplicate (not counted)'; r.warn = true; rows.push(r); return; }
    seen.add(t);
    if (r.raw !== null) { r.t = r.raw + 720 * Math.max(0, Math.ceil((prevMax - 30 - r.raw) / 720)); }
    r.n = ++n;
    if (r.raw === null) { r.flag = 'Time'; r.warn = true; }
    else if (r.plant === null) { r.flag = 'Plant'; r.warn = true; }
    else if (r.qty === null) { r.flag = 'Quantity'; r.warn = true; }
    else if (r.serial !== null && serials.includes(r.serial)) { r.flag = 'Same serial ' + r.serial; r.warn = true; }
    else if (prevMax > 0 && r.t - prevMax > 180) { r.flag = 'Gap > 3h'; r.warn = true; }
    else if (r.t - r.raw >= 1440) r.flag = 'next day';
    else if (r.t - r.raw >= 720) r.flag = '12h → 24h';
    if (!r.warn && r.qty !== null) {                 // load check: the pour's Truck load (Setup) and the truck's biggest load
      const fixed = p.load && p.load !== 'full' ? +p.load : null, max = r.truck ? truckMax(r.truck) : null;
      let why = '';
      if (max !== null && r.qty > max) why = `Truck ${r.truck} max ${max} m³ — message says ${fmt(r.qty)}`;
      else if (fixed !== null && r.qty !== fixed) why = `Load should be ${fixed} m³ — message says ${fmt(r.qty)}`;
      else if (fixed === null && max !== null && r.qty !== max) why = `Truck ${r.truck} is ${max} m³ — message says ${fmt(r.qty)}`;
      if (why && m.ok) r.flag = 'Load OK ✓ (you checked it)';
      else if (why) { r.flag = why; r.warn = true; r.loadWarn = true; }
    }
    if (r.serial !== null) serials.push(r.serial);
    if (r.t !== undefined) prevMax = Math.max(prevMax, r.t);
    r.rejQty = !m.r ? 0 : (typeof m.r === 'number' ? m.r : (r.qty || 0));
    rows.push(r);
  });
  // serial check for the whole pour: numbers nobody sent (or you marked OK) and numbers sent twice
  const okS = new Set(p.serialOk || []), cnt = {};
  serials.forEach(s => cnt[s] = (cnt[s] || 0) + 1);
  const minS = serials.length ? Math.min(...serials) : 0, maxS = serials.length ? Math.max(...serials) : 0, missing = [];
  for (let s = minS + 1; s < maxS && missing.length < 50; s++) if (!cnt[s] && !okS.has(s)) missing.push(s);
  const twice = Object.keys(cnt).filter(s => cnt[s] > 1).map(Number);

  const live = rows.filter(r => !r.dup), timed = live.filter(r => r.t !== undefined);
  const M = {rows, hours:[], totals:[0,0,0,0,0], net:[0,0,0,0,0], trucks: timed.length, missing, twice, minS, maxS,
             toCheck: rows.filter(r => r.warn && !r.dup).length + missing.length};
  M.loaded = live.reduce((a, r) => a + (r.qty || 0), 0);
  M.rejected = live.reduce((a, r) => a + r.rejQty, 0) + (+p.rejManual || 0);
  M.q = +p.q || 0;
  M.remaining = p.q === '' ? null : M.q - M.loaded + M.rejected;
  // past the total quantity: the extra trucks are "Additional quantity", shown positive and green (not -7)
  M.extra = M.remaining !== null && M.remaining < 0;
  M.remLabel = M.extra ? 'ADDITIONAL QUANTITY' : 'REMAINING';
  M.remText = M.remaining === null ? '' : fmt(Math.abs(M.remaining)) + ' m³';
  M.progress = M.q > 0 ? (M.loaded - M.rejected) / M.q : null;
  live.forEach(r => { if (r.plant !== null && r.qty) { M.totals[r.plant] += r.qty; M.net[r.plant] += r.qty - r.rejQty; } });   // net = after rejections (TOTAL row)
  if (timed.length) {
    const first = Math.min(...timed.map(r => r.t)), last = Math.max(...timed.map(r => r.t));
    let start = Math.round(first / 15) * 15;
    if (p.start) { const a = p.start.split(':'); start = +a[0]*60 + +a[1]; }
    const nH = Math.max(1, Math.min(48, Math.floor((last - start) / 60) + 1));
    let req = +p.req || 0, wSum = 0, wMin = 0;
    for (let i = 0; i < nH; i++) {
      const lab = start + 60*i, from = i === 0 ? Math.min(start, first) : lab, to = lab + 60, key = String(lab);
      const h = {key, label: hhmm(lab) + ' – ' + hhmm(to), short: hhmm(lab), end: hhmm(to), plants:[0,0,0,0,0], rate:0, trucks:0, last: i === nH - 1};
      timed.forEach(r => { if (r.t >= from && r.t < to) { h.rate += r.qty || 0; h.trucks++; if (r.plant !== null) h.plants[r.plant] += r.qty || 0; } });
      const ch = p.changes[key];
      h.changed = ch !== undefined && ch !== '' && +ch !== req;
      if (ch !== undefined && ch !== '') req = +ch;
      h.req = req;
      const mins = Math.min(to, last) - Math.max(from, first);   // minutes of this hour inside the pour so far
      if (mins > 0) { wSum += req * mins; wMin += mins; }
      h.comment = p.comments[key] || '';
      h.auto = ch !== undefined && ch !== '' ? ch : null;      // rate and comment in the same hour: both, one under the other
      h.state = h.rate >= req ? 'g' : 'r';                     // no grey: the hour in progress is green or red too (user, 14-Oct-2026)
      M.hours.push(h);
    }
    M.first = first; M.last = last; M.start = start; M.reqNow = req;
    // what the client asked for on average over the same time as our average: each rate counts for the
    // minutes it was in force, so raising the rate late in the pour does not turn our average red
    M.reqAvg = wMin > 0 ? wSum / wMin : req;
    M.avg = last - first >= 30 ? M.loaded / ((last - first) / 60) : null;
  } else { M.reqNow = M.reqAvg = +p.req || 0; M.avg = null; }
  M.avgOk = M.avg !== null && Math.round(M.avg) >= Math.round(M.reqAvg);
  M.target = Math.round(M.reqAvg) !== Math.round(M.reqNow) ? 'AVG Requested rate ' + Math.round(M.reqAvg) + ' m³/h' : '';   // only once the client changed the rate
  M.finish = finishText(p, M);
  return M;
}
function finishText(p, M){
  if (p.finished) return '—';                       // pour closed by the user
  if (M.remaining === null || M.avg === null) return '—';
  if (M.remaining <= 0) return 'Done';
  if (M.avg <= 0) return '—';
  const f = M.last + M.remaining / M.avg * 60;
  const base = p.date ? new Date(p.date + 'T00:00:00') : new Date(); base.setHours(0,0,0,0);
  // the pour date is the day of the FIRST HOUR shown (a truck at 23:58 opens the 00:00 hour of that date)
  const dt = new Date(base.getTime()); dt.setDate(dt.getDate() + Math.floor(f / 1440) - Math.floor(M.start / 1440));
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((dt - today) / 864e5);
  const day = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : dt.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'}).replace(',', '');
  const m = ((Math.floor(f) % 1440) + 1440) % 1440, h = Math.floor(m / 60);   // whole minutes, like the Excel sheet
  return day + ' ' + ((h + 11) % 12 + 1) + ':' + String(m % 60).padStart(2,'0') + (h < 12 ? ' AM' : ' PM');
}

/* ====== picture (canvas) ====== */

      place('tblCorner_1', x1 - .5, y1 - .5, x1 - .5 + cs, y1 - .5 + cs); place('tblCorner_2', x2 - cs + .5, y1 - .5, x2 + .5, y1 - .5 + cs);
      place('tblCorner_3', x1 - .5, y2 - cs + .5, x1 - .5 + cs, y2 + .5); place('tblCorner_4', x2 - cs + .5, y2 - cs + .5, x2 + .5, y2 + .5);
    }
    store(drawPath, D);
    if (M.hours.length > 17) {                       // long pours: every hour's time, slanted (same as the app)
      const chartPath = 'xl/charts/chart1.xml', CH = load(chartPath), CNS = 'http://schemas.openxmlformats.org/drawingml/2006/chart';
      const ax = CH.getElementsByTagNameNS(CNS, 'catAx')[0];
      if (ax) { const bp = ax.getElementsByTagNameNS(DA, 'bodyPr')[0]; if (bp) bp.setAttribute('rot', '-2700000');
        if (!ax.getElementsByTagNameNS(CNS, 'tickLblSkip').length) { const sk = CH.createElementNS(CNS, 'c:tickLblSkip'); sk.setAttribute('val', '1');
          const after = ax.getElementsByTagNameNS(CNS, 'lblOffset')[0]; ax.insertBefore(sk, after ? after.nextSibling : null); } }
      store(chartPath, CH);
    }

    // the "Picture" sheet holds a LIVE linked picture of the report area (Excel redraws it whenever
    // the archive is edited); give it this pour's size: columns A:N, rows 1 to one past the TOTAL row
    {
      const picPath = zip.FullPaths.map(x => x.replace(/^[^/]*\//, '')).find(x => /^xl\/drawings\/drawing\d+\.xml$/.test(x) && new TextDecoder().decode(part(x).content).includes('cameraTool'));
      if (picPath) {
        const PD = load(picPath), pic = PD.getElementsByTagNameNS(XDR, 'pic')[0], old = pic.parentNode;
        const cx = Math.round(geo.colLeft[14] * EMU), cy = Math.round(geo.rowTop[21 + M.hours.length] * EMU);
        const one = PD.createElementNS(XDR, 'xdr:oneCellAnchor'), ext = PD.createElementNS(XDR, 'xdr:ext');
        ext.setAttribute('cx', cx); ext.setAttribute('cy', cy);
        one.appendChild(old.getElementsByTagNameNS(XDR, 'from')[0].cloneNode(true)); one.appendChild(ext); one.appendChild(pic);
        one.appendChild(PD.createElementNS(XDR, 'xdr:clientData'));
        old.parentNode.replaceChild(one, old);
        const xe = pic.getElementsByTagNameNS(DA, 'ext')[0]; if (xe) { xe.setAttribute('cx', cx); xe.setAttribute('cy', cy); }
        store(picPath, PD);
      }
    }

    const out = XLSX.CFB.write(zip, {fileType:'zip', type:'array', compression:true});
    const blob = new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    if (handle) { const wr = await handle.createWritable(); await wr.write(blob); await wr.close(); toast('Excel file saved — open it and press Enable Editing'); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 20000);
    toast('Excel file downloaded — open it and press Enable Editing');
  } catch (err) { console.warn(err); toast('Could not make the Excel file'); }
};

/* ====== sync (optional): Apps Script store, data encrypted on the device ====== */
const b64 = u8 => { let s = ''; u8.forEach(c => s += String.fromCharCode(c)); return btoa(s); };
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pwd){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:new TextEncoder().encode('pouring-report-v1'), iterations:150000}, base, 384));
  return {store: Array.from(bits.slice(0, 16)).map(x => x.toString(16).padStart(2,'0')).join(''), aes: b64(bits.slice(16))};
}
async function aesKey(){ return crypto.subtle.importKey('raw', u8(S.key.aes), 'AES-GCM', false, ['encrypt','decrypt']); }
async function pack(obj){
  let data = new TextEncoder().encode(JSON.stringify(obj)), z = 0;
  if (window.CompressionStream) { data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); z = 1; }
  const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, await aesKey(), data));
  return z + '.' + b64(iv) + '.' + b64(ct);
}
async function unpack(s){
  const a = s.split('.'); let data = new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(a[1])}, await aesKey(), u8(a[2])));
  if (a[0] === '1') data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(data));
}
async function api(body){
  const r = await fetch(SYNC_URL, {method:'POST', body: JSON.stringify(Object.assign({k:S.key.store}, body))});
  return r.json();
}
function merge(a, b){                       // a = local, b = remote
  const nw = a.at >= b.at ? a : b, od = nw === a ? b : a, o = Object.assign({}, od, nw);
  if (a.deleted || b.deleted) { o.deleted = true; o.msgs = []; return o; }
  o.del = Array.from(new Set([...(a.del || []), ...(b.del || [])]));
  const seen = new Set(); o.msgs = [];
  [...nw.msgs, ...od.msgs].forEach(m => { const t = cleanLine(m.t); if (seen.has(t) || o.del.includes(t)) return; seen.add(t); o.msgs.push(m); });
  if (od.msgs.some(m => !nw.msgs.some(x => cleanLine(x.t) === cleanLine(m.t)))) {       // keep time order when both sides added trucks
    const key = m => { const q = parseMsg(cleanLine(m.t)); return q.serial === null ? 1e9 : q.serial; }; o.msgs = o.msgs.map((m, i) => [m, i]).sort((x, y) => key(x[0]) - key(y[0]) || x[1] - y[1]).map(x => x[0]); }
  o.changes = Object.assign({}, od.changes, nw.changes); o.comments = Object.assign({}, od.comments, nw.comments);
  o.serialOk = Array.from(new Set([...(a.serialOk || []), ...(b.serialOk || [])]));
  return o;
}
let syncing = false, syncAgain = false, syncState = 'local', syncT = null;
function queueSync(){ clearTimeout(syncT); syncT = setTimeout(syncAll, 1200); }
async function syncAll(){
  if (!SYNC_URL || !S.key) { syncState = 'local'; renderSync(); return; }
  if (syncing) { syncAgain = true; return; }
  syncing = true; syncState = 'syncing'; renderSync();
  try {
    const L = await api({op:'list'}); if (!L.ok) throw new Error(L.err || 'list');
    let changed = false, arrived = null;
    const born = id => parseInt(id.slice(0, -4), 36) || 0, blank = p => !p.rev && !p.title && !p.msgs.length && p.q === '';
    for (const id of Object.keys(L.idx)) {
      const loc = S.pours[id];
      if (loc && loc.rev >= L.idx[id].rev) continue;
      const G = await api({op:'get', id}); if (!G.ok || !G.found) continue;
      const rem = await unpack(G.data);
      if (!loc && !rem.deleted && (!arrived || born(id) > born(arrived))) arrived = id;
      if (loc && loc.dirty) { S.pours[id] = Object.assign(merge(loc, rem), {rev:G.rev, dirty:true, at:Date.now()}); }
      else { S.pours[id] = Object.assign(rem, {rev:G.rev, dirty:false}); }
      changed = true;
    }
    // a pour started on another device opens here too (and replaces an untouched empty one)
    if (arrived && (blank(cur()) || born(arrived) > born(S.cur))) { if (blank(cur())) delete S.pours[S.cur]; S.cur = arrived; }
    for (const p of Object.values(S.pours)) {
      if (!p.dirty) continue;
      if (blank(p) && !p.deleted) continue;                                                 // untouched empty pour stays local
      for (let tries = 0; tries < 3 && p.dirty; tries++) {
        const sentAt = p.at, doc = Object.assign({}, p); delete doc.dirty; delete doc.rev;
        const R = await api({op:'put', id:p.id, base:p.rev, data: await pack(doc)});
        if (R.ok) { p.rev = R.rev; if (p.at === sentAt) p.dirty = false; }
        else if (R.conflict) { const rem = R.data ? await unpack(R.data) : null; if (rem) Object.assign(p, merge(p, rem)); p.rev = R.rev; p.dirty = true; changed = true; }
        else throw new Error(R.err || 'put');
      }
    }
    Object.values(S.pours).forEach(p => { if (p.deleted && !p.dirty && p.id !== S.cur) delete S.pours[p.id]; });
    if (!S.pours[S.cur] || S.pours[S.cur].deleted) { const rest = Object.values(S.pours).filter(x => !x.deleted).sort((a, b) => b.at - a.at)[0] || newPour(); S.pours[rest.id] = rest; S.cur = rest.id; changed = true; }
    save(false); syncState = 'ok'; S.lastSync = Date.now();
    if (changed && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) render();
  } catch (err) { syncState = navigator.onLine ? 'error' : 'offline'; console.warn('sync', err); }
  syncing = false; renderSync();
  if (syncAgain) { syncAgain = false; queueSync(); }
}
function renderSync(){
  const txt = {local:'on this device only', syncing:'syncing…', ok:'synced ✓', error:'sync error', offline:'offline'}[syncState];
  $('sync').textContent = txt; $('sync').style.background = syncState === 'ok' ? 'rgba(80,200,120,.35)' : syncState === 'error' ? 'rgba(255,90,90,.45)' : 'rgba(255,255,255,.18)';
  $('syncInfo').textContent = !SYNC_URL ? 'Sync is not set up in this build yet — pours are saved on this device only.' : !S.key ? 'Type the sync password to share pours between your phone and laptop. The first device chooses it; type the same one on the others.' : 'Sync is on. Status: ' + txt + '.';
}
$('bPwd').onclick = async () => { const v = $('sPwd').value; if (v.length < 4) { toast('Password must be at least 4 characters'); return; } if (!SYNC_URL) { toast('Sync is not set up in this build yet'); return; }
  S.key = await deriveKey(v); $('sPwd').value = ''; Object.values(S.pours).forEach(p => { p.rev = 0; p.dirty = true; }); save(false); toast('Password saved — syncing'); syncAll(); };
$('bSync').onclick = () => { if (!S.key) { toast('Save the sync password first'); return; } syncAll(); };
$('bOff').onclick = () => { if (!S.key || !confirm('Turn sync off on this device? The pours stay here.')) return; S.key = null; save(false); syncState = 'local'; renderSync(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncAll(); });
setInterval(() => { if (!document.hidden) syncAll(); }, 20000);

render(); syncAll();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
